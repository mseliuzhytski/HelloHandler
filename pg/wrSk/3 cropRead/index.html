<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSV Processor</title>
<style>
  body { font-family: Arial; padding: 20px; }
  button { margin: 5px; padding: 8px; }
  #log { margin-top: 20px; }
</style>
</head>
<body>

    <h2>Test reading pdf</h2>

    <input type="file" id="fileInput" accept=".csv"><br>

    <script>

let headerTags = [];
// Parse CSV helper
function parseCSV(text) {
    const rows = text.split("\n").map(r => r.split(","));
    const headers = rows[0].map(h => {h.trim().toLowerCase();headerTags.push(h);});
    return rows.slice(1).map(row => {
        let obj = {};
        headers.forEach((h, i) => obj[h] = row[i]?.trim());
        return obj;
    });
}

document.getElementById("fileInput").addEventListener('change', processCSV);

function processCSV(){
    if (!fileInput.files.length) return;
    const file = fileInput.files[0];

    const reader = new FileReader();

    reader.onload = function(e) {
        const data = parseCSV(e.target.result);
    };

    reader.readAsText(file);

    console.log(headerTags);
}


    </script>

</body>
</html>
