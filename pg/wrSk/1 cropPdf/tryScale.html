<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CSV Processor</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        input,
        button {
            margin: 5px;
            padding: 8px;
        }

        #log {
            margin-top: 20px;
        }

        .l-p-sb-sbh {
            position: absolute;
            margin-top: 30px;
        }

        .l-p-sb {
            display: flex;
            height: 432px;
            overflow: hidden;
        }

        .l-c {
            position: relative;
            display: block;
            margin-left: 30px;
            margin-right: 30px;
            background-color: red;
            width: 288px;
        }

        .cs {
            display: block;
            background-color: black;
            margin-top: 0px;
            height: 50px;
            position: absolute;
            width: 100%;
            transition: margin-top 0.05s linear;
        }

        /* Scrollbar */
        .scroll-bar {
            position: relative;
            width: 10px;
            height: inherit;
            background: #379e00;
        }

        .scroll-thumb {
            position: absolute;
            top: 0;
            width: 100%;
            height: 60px;
            background: #3100ae;
            cursor: pointer;
        }

        /* Scrollbar Horizontal*/
        .scroll-bar-h {
            position: relative;
            margin-top: 30px;
            margin-left: 30px;
            margin-right: 40px;
            height: 10px;
            width: inherit;
            background: #379e00;
        }

        .scroll-thumb-h {
            position: absolute;
            left: 0;
            height: 100%;
            width: 60px;
            background: #3100ae;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>Test</h2>

    <div class="l-p-sb-sbh">

        <div class="l-p-sb">
            <div class="l-c">
                <div class="cs"></div>
            </div>
            <div class="scroll-bar">
                <div class="scroll-thumb"></div>
            </div>
        </div>
        <div class="scroll-bar-h">
            <div class="scroll-thumb-h"></div>
        </div>

    </div>

    <script>
        const thumb = document.querySelector('.scroll-thumb');
        const bar = document.querySelector('.scroll-bar');
        const content = document.querySelector('.cs');

        let isDragging = false;
        let startY, startTop;

        thumb.addEventListener('mousedown', (e) => {
            isDragging = true;
            startY = e.clientY;
            startTop = thumb.offsetTop;
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            document.body.style.userSelect = '';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const delta = e.clientY - startY;
            let newTop = startTop + delta;

            const maxTop = bar.clientHeight - thumb.clientHeight;

            // clamp
            if (newTop < 0) newTop = 0;
            if (newTop > maxTop) newTop = maxTop;

            thumb.style.top = newTop + 'px';

            // map scrollbar position → content movement
            const scrollRatio = newTop / maxTop;

            const maxScroll = content.scrollHeight - bar.clientHeight;

            content.style.marginTop = -(scrollRatio * maxScroll) + 'px';
        });
    </script>

    <script>
        const thumbH = document.querySelector('.scroll-thumb-h');
        const barH = document.querySelector('.scroll-bar-h');

        let isDraggingH = false;
        let startX, startLeft;

        thumbH.addEventListener('mousedown', (e) => {
            isDraggingH = true;
            startX = e.clientX;
            startLeft = thumbH.offsetLeft;
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mouseup', () => {
            isDraggingH = false;
            document.body.style.userSelect = '';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDraggingH) return;

            const delta = e.clientX - startX;
            let newLeft = startLeft + delta;

            const maxLeft = barH.clientWidth - thumbH.clientWidth;

            // clamp
            if (newLeft < 0) newLeft = 0;
            if (newLeft > maxLeft) newLeft = maxLeft;

            thumbH.style.left = newLeft + 'px';

            // map position → height
            const ratio = newLeft / maxLeft;

            const minHeight = 20;   // smallest height
            const maxHeight = 400;  // biggest height (adjust as needed)

            const newHeight = minHeight + ratio * (maxHeight - minHeight);

            content.style.height = newHeight + 'px';
        });
    </script>

</body>

</html>
