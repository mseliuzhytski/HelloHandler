<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSV Processor</title>
<style>
  body { font-family: Arial; padding: 20px; }
  input, button { margin: 5px; padding: 8px; }
  #log { margin-top: 20px; }
</style>
</head>
<body>

    <h2>Test reading pdf</h2>

    <input type="file" id="fileInput" accept=".pdf"><br>

    <button onclick="processName()">READ</button>

    <h4>logging</h4>
    <div id="txtoutid"></div>

    <script src="pdf.min.js"></script>
    <script>

      pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";

      const wlg = document.getElementById("txtoutid");

      async function extractValue() {
        const fileInput = document.getElementById("fileInput");
        if (!fileInput.files.length) return;
        const file = fileInput.files[0];
        const arrayBuffer = await file.arrayBuffer();

        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

        let fullText = "";

        const texts = await Promise.all(
          Array.from({ length: pdf.numPages }, async (_, i) => {
            const page = await pdf.getPage(i + 1);
            const content = await page.getTextContent();
            return content.items.map(item => item.str).join(" ");
          })
        );

        fullText = texts.join("\n");
        console.log("out:"+fullText);
      }

      function processName() {
          const fileInput = document.getElementById("fileInput");
          if (!fileInput.files.length) return;
          wlg.innerText = fileInput.files[0].name;
          extractValue();
      }

    </script>

</body>
</html>
