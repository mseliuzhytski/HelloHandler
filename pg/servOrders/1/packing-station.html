<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Packing Station</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent:      #0099ff;
    --accent-bg:   rgba(0,153,255,0.10);
    --accent-mid:  rgba(0,153,255,0.20);
    --bg:          #f0f4f8;
    --surface:     rgba(255,255,255,0.90);
    --border:      rgba(0,0,0,0.10);
    --border-lite: rgba(0,0,0,0.06);
    --text-1:      #1d1d1f;
    --text-2:      #6e6e73;
    --text-3:      #b0b0b8;
    --green:       #28c840;
    --red:         #ff3b30;
    --blur:        blur(20px) saturate(1.4);
    --r-md:        10px;
    --r-lg:        16px;
  }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text-1); -webkit-font-smoothing: antialiased; }

  /* titlebar */
  .titlebar { position: sticky; top: 0; z-index: 100; height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: rgba(255,255,255,0.82); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border-bottom: 0.5px solid var(--border); }
  .dots { display: flex; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-r{background:#ff5f57}.dot-y{background:#febc2e}.dot-g{background:#28c840}
  .tb-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .tb-title i { color: var(--accent); font-size: 15px; }
  .tb-badge { font-size: 11px; font-weight: 500; color: var(--accent); background: var(--accent-bg); padding: 3px 10px; border-radius: 20px; border: 0.5px solid rgba(0,153,255,0.2); }

  /* layout */
  .main { max-width: 960px; margin: 0 auto; padding: 24px 20px 48px; display: flex; flex-direction: column; gap: 16px; }

  /* card */
  .card { background: var(--surface); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 0.5px solid var(--border); border-radius: var(--r-lg); padding: 18px 20px; }
  .section-label { font-size: 11px; font-weight: 600; color: var(--text-2); letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
  .section-label i { font-size: 13px; color: var(--accent); }

  /* tracking input */
  .input-wrap { display: flex; gap: 10px; align-items: center; }
  .track-input { flex: 1; height: 44px; border: 1.5px solid #dde0e8; border-radius: var(--r-md); padding: 0 14px; font-size: 15px; font-family: inherit; color: var(--text-1); background: rgba(255,255,255,0.9); outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
  .track-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,153,255,0.15); }
  .track-input::placeholder { color: var(--text-3); }
  .clear-btn { height: 44px; padding: 0 14px; border: 0.5px solid var(--border); border-radius: var(--r-md); background: transparent; color: var(--text-2); font-size: 13px; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: background 0.15s; }
  .clear-btn:hover { background: rgba(0,0,0,0.05); }

  /* result panel */
  .result-panel { margin-top: 14px; border: 1.5px solid rgba(0,153,255,0.2); border-radius: var(--r-md); min-height: 80px; padding: 14px 16px; background: rgba(0,153,255,0.03); transition: border-color 0.2s, background 0.2s; }
  .result-panel.state-loading { border-color: rgba(0,153,255,0.3); }
  .result-panel.state-ok      { border-color: rgba(40,200,64,0.35); background: rgba(40,200,64,0.04); }
  .result-panel.state-error   { border-color: rgba(255,59,48,0.3);  background: rgba(255,59,48,0.04); }

  .result-empty { display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 13px; padding: 10px 0; }
  .result-empty i { font-size: 20px; color: var(--accent); opacity: 0.3; }

  .result-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 0.5px solid var(--border-lite); }
  .order-label { font-size: 12px; color: var(--text-2); }
  .order-label strong { color: var(--accent); font-weight: 500; }
  .tracking-chip { font-family: 'SF Mono','Menlo',monospace; font-size: 11px; color: var(--text-2); background: rgba(0,0,0,0.05); padding: 3px 8px; border-radius: 6px; }

  .item-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 0.5px solid var(--border-lite); }
  .item-row:last-child { border-bottom: none; }
  .item-sku { font-family: 'SF Mono','Menlo',monospace; font-size: 13px; font-weight: 500; }
  .item-name { font-size: 11px; color: var(--text-2); margin-top: 2px; }
  .qty-pill { background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }

  /* table card */
  .table-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .refresh-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--accent); background: var(--accent-bg); border: 0.5px solid rgba(0,153,255,0.25); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-family: inherit; transition: background 0.15s; }
  .refresh-btn:hover { background: var(--accent-mid); }
  .refresh-btn:active { transform: scale(0.97); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  thead th { font-size: 11px; font-weight: 600; color: var(--text-2); letter-spacing: 0.06em; text-transform: uppercase; text-align: left; padding: 0 10px 10px; border-bottom: 0.5px solid var(--border); }
  tbody td { padding: 10px; border-bottom: 0.5px solid var(--border-lite); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--accent-bg); }
  .td-order { color: var(--accent); font-weight: 500; }
  .td-mono { font-family: 'SF Mono','Menlo',monospace; font-size: 11px; color: var(--text-2); }
  .td-qty { display: inline-block; background: var(--accent-bg); color: #0070d1; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 12px; }

  .empty-state { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 36px; color: var(--text-3); font-size: 13px; text-align: center; }
  .empty-state i { font-size: 28px; color: var(--accent); opacity: 0.25; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 0.8s linear infinite; display: inline-block; }
</style>
</head>
<body>

<div class="titlebar">
  <div class="dots">
    <div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div>
  </div>
  <div class="tb-title"><i class="ti ti-package" aria-hidden="true"></i> Packing Station</div>
  <div class="tb-badge">ShipStation</div>
</div>

<div class="main">

  <!-- Tracking lookup card -->
  <div class="card">
    <div class="section-label"><i class="ti ti-truck-delivery" aria-hidden="true"></i> Tracking number</div>
    <div class="input-wrap">
      <input id="inp-tracking" class="track-input" type="text" placeholder="Scan or enter tracking number…" autocomplete="off" />
      <button class="clear-btn" onclick="clearTracking()"><i class="ti ti-x" aria-hidden="true"></i> Clear</button>
    </div>
    <div id="result-panel" class="result-panel">
      <div class="result-empty"><i class="ti ti-scan" aria-hidden="true"></i> Enter a tracking number to look up the order</div>
    </div>
  </div>

  <!-- Shipped orders table card -->
  <div class="card">
    <div class="table-topbar">
      <div class="section-label" style="margin-bottom:0"><i class="ti ti-list-check" aria-hidden="true"></i> Shipped orders</div>
      <button class="refresh-btn" id="refresh-btn" onclick="loadShipments()">
        <i class="ti ti-refresh" id="refresh-icon" aria-hidden="true"></i> Refresh
      </button>
    </div>
    <div id="table-wrap">
      <div class="empty-state"><i class="ti ti-inbox" aria-hidden="true"></i>No shipments yet</div>
    </div>
  </div>

</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────
const API_BASE = 'https://api.ancienthowl.net';
// ─────────────────────────────────────────────────────────────────

const trackingInput = document.getElementById('inp-tracking');
const resultPanel   = document.getElementById('result-panel');

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setPanel(state, html) {
  resultPanel.className = 'result-panel' + (state ? ' state-' + state : '');
  resultPanel.innerHTML = html;
}

function clearTracking() {
  trackingInput.value = '';
  setPanel('', '<div class="result-empty"><i class="ti ti-scan" aria-hidden="true"></i> Enter a tracking number to look up the order</div>');
  trackingInput.focus();
}

// When user finishes typing / scanning (Enter or tab away)
trackingInput.addEventListener('change', async () => {
  const tracking = trackingInput.value.trim();
  if (!tracking) return;

  setPanel('loading', '<div class="result-empty"><i class="ti ti-loader-2 spin" aria-hidden="true"></i> Looking up tracking number…</div>');

  try {
    const res = await fetch(`${API_BASE}/webhook`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        resource_type: 'SHIP_NOTIFY',
        resource_url:  `https://ssapi.shipstation.com/shipments?trackingNumber=${encodeURIComponent(tracking)}`
      })
    });

    const data = await res.json();

    if (!res.ok || !data.shipment) {
      setPanel('error', `
        <div class="result-empty" style="color:var(--red)">
          <i class="ti ti-alert-triangle" aria-hidden="true" style="color:var(--red);opacity:1"></i>
          ${esc(data.error || 'Tracking number not found in ShipStation')}
        </div>`);
      return;
    }

    renderShipment(data.shipment);
    loadShipments(); // refresh table automatically

  } catch (e) {
    setPanel('error', '<div class="result-empty" style="color:var(--red)"><i class="ti ti-wifi-off" aria-hidden="true" style="color:var(--red);opacity:1"></i> Cannot reach backend</div>');
  }
});

function renderShipment(s) {
  const rows = s.items.map(item => `
    <div class="item-row">
      <div>
        <div class="item-sku">${esc(item.sku)}</div>
        <div class="item-name">${esc(item.name || '')}</div>
      </div>
      <div class="qty-pill">${item.quantity}&times;</div>
    </div>`).join('');

  setPanel('ok', `
    <div class="result-meta">
      <div class="order-label">Order <strong>${esc(s.orderNumber)}</strong></div>
      <div class="tracking-chip">${esc(s.trackingNumber)}</div>
    </div>
    ${rows || '<div class="result-empty"><i class="ti ti-alert-circle" aria-hidden="true"></i> No items found on this shipment</div>'}`);
}

// ── Table ─────────────────────────────────────────────────────────
async function loadShipments() {
  const icon = document.getElementById('refresh-icon');
  const btn  = document.getElementById('refresh-btn');
  icon.classList.add('spin'); btn.disabled = true;

  try {
    const res  = await fetch(`${API_BASE}/shipments`);
    const rows = await res.json();
    renderTable(rows);
  } catch (e) {
    document.getElementById('table-wrap').innerHTML =
      '<div class="empty-state"><i class="ti ti-wifi-off" aria-hidden="true"></i>Could not reach backend</div>';
  }

  icon.classList.remove('spin'); btn.disabled = false;
}

function renderTable(rows) {
  const wrap = document.getElementById('table-wrap');
  if (!rows.length) {
    wrap.innerHTML = '<div class="empty-state"><i class="ti ti-inbox" aria-hidden="true"></i>No shipments yet</div>';
    return;
  }
  const trs = rows.map(r => `<tr>
    <td class="td-order">${esc(r.orderNumber)}</td>
    <td class="td-mono" title="${esc(r.trackingNumber)}">${esc(r.trackingNumber)}</td>
    <td><span class="td-qty">${r.quantity}&times;</span></td>
    <td class="td-mono" title="${esc(r.sku)}">${esc(r.sku)}</td>
  </tr>`).join('');

  wrap.innerHTML = `<table aria-label="Shipped orders">
    <thead><tr>
      <th style="width:22%">Order</th>
      <th style="width:37%">Tracking</th>
      <th style="width:10%">Qty</th>
      <th style="width:31%">SKU</th>
    </tr></thead>
    <tbody>${trs}</tbody>
  </table>`;
}

loadShipments();
</script>
</body>
</html>
